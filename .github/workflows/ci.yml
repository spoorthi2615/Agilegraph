name: AgileGraph CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pip-audit ruff black

      - name: Code Formatting Check
        working-directory: ./backend
        run: |
          black --check .
          ruff check .

      - name: Security Scan
        working-directory: ./backend
        run: pip-audit --desc on

      - name: Prepare Test Corpus (WebGoat)
        working-directory: ./backend
        run: |
          mkdir -p data/corpus
          git clone --depth 1 https://github.com/WebGoat/WebGoat.git data/corpus/WebGoat

      - name: Run Tests
        working-directory: ./backend
        run: pytest --cov=app --cov-report=xml

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7


  frontend-ci:
    name: Frontend Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.x"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './frontend-1/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend-1
        run: npm ci

      - name: Security Scan
        working-directory: ./frontend-1
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript Compile & Build
        working-directory: ./frontend-1
        run: npm run build


  docker-ci:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Compose Syntax
        run: docker compose config -q

      - name: Build Backend Image
        working-directory: ./backend
        run: docker build -t agilegraph-backend:test .

      - name: Build Frontend Image
        working-directory: ./frontend-1
        run: docker build --build-arg VITE_API_BASE_URL=http://localhost:8000/api/v1 -t agilegraph-frontend:test .

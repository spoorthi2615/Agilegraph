server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content Security Policy
    # Note: connect-src uses an env variable template or just a generic allow. 
    # For a purely static Nginx config, we'll allow standard origins or the backend container.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:8000 http://backend:8000 https://*; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
